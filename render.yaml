services:
  - type: web
    name: azure-multiagent-assistant
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: AZURE_EXISTING_AIPROJECT_ENDPOINT
        value: https://multi-agent-business.services.ai.azure.com/api/projects/multi-agent-business
      - key: AZURE_TENANT_ID
        sync: false
      - key: AZURE_CLIENT_ID
        sync: false
      - key: AZURE_CLIENT_SECRET
        sync: false
